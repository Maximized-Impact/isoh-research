# research.maximized-impact.org (Netlify site maximized-impact-research). Static files only: no build, no functions.
# Handoff v14, Architecture > Netlify site settings. The connect-src origin below must be the origin of FUNCTION_URL in study7/config.js.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'"

[[headers]]
  for = "/study7/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://europe-north1-maximized-impact-research.cloudfunctions.net; img-src 'self' data:; font-src 'self'; media-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'"
