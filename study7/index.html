<!-- ============ in-call bar (shown after Call) ============ -->
<header class="topbar" id="topbar" hidden>
  <div class="row">
    <div class="left"><div class="cd" id="cd" aria-live="off">03:00</div><div class="status" id="status"></div></div>
    <div class="tools">
      <button class="rb green" id="tbFocus" type="button" data-s-aria="focus.aria_focus_toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wave"/></svg></button>
      <button class="rb amber" id="tbSignal" type="button" data-s-aria="focus.aria_signal_toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-watch"/></svg></button>
      <button class="sq" id="tbOpen" type="button" data-s-aria="focus.aria_open"><span class="ts"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-watch"/></svg></span><span class="fs"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wave"/></svg></span></button>
    </div>
  </div>
  <div class="row2"><div class="el" id="el"></div><div class="el" id="rem"></div></div>
  <div class="bar" id="bar"><i></i></div>
</header>

<!-- ============ survey ============ -->
<main class="survey" id="survey" hidden>
  <div id="surveyHead">
    <h1 data-s="survey.title"></h1>
    <p class="intro" data-s="survey.intro1"></p>
    <p class="intro" data-s="survey.intro2"></p>
  </div>
  <div id="items"></div>
  <button class="submit" id="submit" type="button" data-s="survey.send"></button>
  <p class="send-error" id="sendError" role="alert" hidden data-s="thanks.send_failed"></p>
  <p class="send-error" id="unanswered" role="alert" hidden data-s="survey.unanswered"></p>
  <section class="thanks" id="thanks">
    <svg class="mark" aria-hidden="true" focusable="false"><use href="#lotus"/></svg>
    <h2 data-s="thanks.title"></h2>
    <p data-s="thanks.sent"></p>
    <p class="intro" data-s="thanks.results"></p>
    <button class="submit secondary" id="download" type="button" data-s="thanks.download"></button>
    <p class="intro" data-s="thanks.download_note"></p>
    <div class="follow">
      <p data-s="thanks.follow_text"></p>
      <a class="follow-btn" href="https://www.instagram.com/maximized_impact_ry" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span data-s="thanks.follow"></span></a>
    </div>
  </section>
  <p class="credit" data-s="survey.credit"></p>
  <div class="thanks-foot" id="thanksFoot" hidden><p class="foot" data-s="thanks.footer"></p></div>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-wave" viewBox="0 0 24 24"><rect x="2" y="9" width="2.4" height="6" rx="1.2"/><rect x="6.4" y="5" width="2.4" height="14" rx="1.2"/><rect x="10.8" y="2" width="2.4" height="20" rx="1.2"/><rect x="15.2" y="6" width="2.4" height="12" rx="1.2"/><rect x="19.6" y="9" width="2.4" height="6" rx="1.2"/></symbol>
  <symbol id="i-watch" viewBox="0 0 24 24"><path d="M9 1h6v2H9zM12 5a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm-1 2h2v5h-2zM19 4.5l1.5 1.5-1.8 1.8-1.5-1.5z"/></symbol>
</svg>

<!-- ============ overlay 0: welcome ============ -->
<div class="scrim" id="welcomeScrim" hidden>
  <section class="card welcome" role="dialog" aria-modal="true" aria-labelledby="studyTitle">
    <div class="lang-row" id="langRow"><label for="lang" data-s="welcome.language_label"></label><select id="lang"></select></div>
    <svg class="mark" aria-hidden="true" focusable="false"><use href="#lotus"/></svg>
    <div class="inst-name" data-s="institute.name"></div>
    <p class="inst-sub" data-s="institute.formula"></p>
    <h1 class="study-h" id="studyTitle" data-s="welcome.title"></h1>
    <p class="study-s" data-s="welcome.study"></p>
    <p class="intro-txt" data-s="welcome.p1"></p>
    <p class="intro-txt" data-s="welcome.p2"></p>
    <p class="intro-txt" data-s="welcome.p3"></p>
    <p class="intro-txt"><a class="notice-link" id="dataNoticeLink" href="/study7/data-notice/" target="_blank" rel="noopener" data-s="welcome.data_notice_link"></a></p>
    <p class="intro-txt" data-s="welcome.p4"></p>
    <p class="repeat-note" id="repeatNote" hidden data-s="welcome.repeat_note"></p>
    <button class="btn cont" id="welcomeContinue" type="button" data-s="welcome.continue_adult"></button>
    <button class="btn quiet" id="welcomeUnder18" type="button" data-s="welcome.under18"></button>
  </section>
</div>

<!-- ============ overlay 0b: under 18 ============ -->
<div class="scrim" id="underScrim" hidden>
  <section class="card welcome" role="dialog" aria-modal="true" aria-labelledby="underTitle">
    <svg class="mark" aria-hidden="true" focusable="false"><use href="#lotus"/></svg>
    <div class="inst-name" data-s="institute.name"></div>
    <p class="inst-sub" data-s="institute.formula"></p>
    <h1 class="study-h" id="underTitle" data-s="under18.title"></h1>
    <p class="intro-txt" data-s="under18.p1"></p>
    <p class="intro-txt" data-s="under18.p2"></p>
    <div class="follow">
      <a class="follow-btn" href="https://www.instagram.com/maximized_impact_ry" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span data-s="under18.follow"></span></a>
    </div>
  </section>
</div>

<!-- ============ overlay 1: call setup ============ -->
<div class="scrim" id="setupScrim" hidden>
  <section class="card setup" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <svg class="mark" aria-hidden="true" focusable="false"><use href="#lotus"/></svg>
    <div class="study" id="setupTitle" data-s="setup.study"></div>
    <p class="sub" data-s="setup.subtitle"></p>

    <div class="picker" data-s-aria="setup.set_duration">
      <div class="picker-head"><span data-s="setup.hours"></span><span data-s="setup.minutes"></span><span data-s="setup.seconds"></span></div>
      <div class="wheels">
        <div class="wheel" id="wh" data-max="23" role="listbox" data-s-aria="setup.hours" tabindex="0"></div>
        <div class="wheel" id="wm" data-max="59" role="listbox" data-s-aria="setup.minutes" tabindex="0"></div>
        <div class="wheel" id="ws" data-max="59" role="listbox" data-s-aria="setup.seconds" tabindex="0"></div>
      </div>
    </div>

    <div class="row-set">
      <span data-s="setup.set_duration"></span>
      <button class="reset" id="reset" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        <span data-s="setup.reset"></span>
      </button>
    </div>

    <div class="preset-labels" id="presetLabels"><span class="long" id="longLabel"></span><span class="short" id="shortLabel"></span></div>
    <div class="custom-label" id="customLabel" hidden></div>

    <div class="buttons" id="buttons">
      <button class="btn long" id="btnLong" type="button" data-s="setup.long_call"></button>
      <button class="btn short" id="btnShort" type="button" data-s="setup.short_call"></button>
    </div>
    <button class="btn call" id="btnCall" type="button" hidden data-s="setup.call"></button>
  </section>
</div>

<!-- ============ overlay 2: focus sound ============ -->
<div class="scrim" id="focusScrim" hidden>
  <section class="card focus" role="dialog" aria-modal="true" aria-labelledby="focusTitle">
    <div class="card-head">
      <h2 id="focusTitle" data-s="focus.title"></h2>
      <div class="head-right">
        <label class="toggle green"><input type="checkbox" id="fsOn" data-s-aria="focus.aria_focus_toggle"><span></span></label>
        <button class="x" id="focusClose" type="button" data-s-aria="focus.close">×</button>
      </div>
    </div>

    <div class="label" data-s="focus.volume"></div>
    <div class="slider-row green">
      <svg class="speaker" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <input type="range" id="fsVol" min="0" max="100" value="17">
      <span class="pct" id="fsVolV">17%</span>
    </div>

    <div class="label" data-s="focus.sound"></div>
    <div class="radios" id="sounds">
      <label class="opt"><input type="radio" name="sound" value="brown" checked><span class="radio"></span><span class="emoji">🟤</span><span data-s="focus.sounds.brown"></span></label>
      <label class="opt"><input type="radio" name="sound" value="white"><span class="radio"></span><span class="emoji">⚪</span><span data-s="focus.sounds.white"></span></label>
      <label class="opt"><input type="radio" name="sound" value="pink"><span class="radio"></span><span class="emoji">🌸</span><span data-s="focus.sounds.pink"></span></label>
      <label class="opt"><input type="radio" name="sound" value="rain"><span class="radio"></span><span class="emoji">🌧️</span><span data-s="focus.sounds.rain"></span></label>
      <label class="opt"><input type="radio" name="sound" value="ocean"><span class="radio"></span><span class="emoji">🌊</span><span data-s="focus.sounds.ocean"></span></label>
      <label class="opt"><input type="radio" name="sound" value="forest"><span class="radio"></span><span class="emoji">🌲</span><span data-s="focus.sounds.forest"></span></label>
    </div>

    <hr>

    <div class="ts-head">
      <div><h3 data-s="focus.time_signal"></h3><div class="sub" data-s="focus.system_wide"></div></div>
      <label class="toggle"><input type="checkbox" id="tsOn" data-s-aria="focus.aria_signal_toggle"><span></span></label>
    </div>
    <div class="label" data-s="focus.volume"></div>
    <div class="slider-row yellow">
      <input type="range" id="tsVol" min="0" max="100" value="17">
      <span class="pct" id="tsVolV">17%</span>
    </div>
    <div class="label" data-s="focus.interval"></div>
    <div class="slider-row yellow">
      <span class="mm" data-s="focus.interval_values.10"></span>
      <input type="range" id="tsInt" min="0" max="3" value="3" step="1">
      <span class="mm r" data-s="focus.interval_values.60"></span>
    </div>
    <div class="ivalue" id="tsIntV"></div>
    <button class="btn cont" id="fsContinue" type="button" hidden data-s="focus.continue"></button>
  </section>
</div>
</body>
